<!DOCTYPE html>
<html>
<head>
    <title>SPQC AI - Browser Mode</title>
    <style>
        body { background: #111; color: #0f0; text-align: center; font-family: sans-serif; }
        video { border: 4px solid #0f0; border-radius: 15px; width: 640px; height: 480px; }
        #status { font-size: 32px; font-weight: bold; margin-top: 20px; }
    </style>
</head>
<body>
    <h1>SPQC AI - GESTURE DETECTOR</h1>
    <video id="webcam" autoplay playsinline></video>
    <div id="status">Mencari Kamera...</div>

    <script>
        const video = document.getElementById('webcam');
        const statusDiv = document.getElementById('status');
        let lastSent = 0;

        // 1. Akses Webcam
        navigator.mediaDevices.getUserMedia({ video: true })
            .then(stream => {
                video.srcObject = stream;
                statusDiv.innerText = "Kamera Aktif! Tekan 1, 2, 3 di Keyboard untuk Simulasi Hand Gesture";
            })
            .catch(err => {
                statusDiv.innerText = "Error: Kamera diblokir aplikasi lain!";
                console.error(err);
            });

        // 2. Simulasi Gesture via Keyboard (Biar Aman buat Demo)
        document.addEventListener('keydown', (e) => {
            let grade = "";
            if (e.key === '1') grade = "1";
            if (e.key === '2') grade = "2";
            if (e.key === '3') grade = "3";

            if (grade !== "" && (Date.now() - lastSent > 3000)) {
                statusDiv.innerText = "MENGIRIM GRADE " + grade + "...";
                statusDiv.style.color = "yellow";

                fetch(`http://10.85.204.5:8000/api/nanas/status?status=${grade}`)
                    .then(res => res.json())
                    .then(data => {
                        statusDiv.innerText = "BERHASIL! Grade: " + data.grade;
                        statusDiv.style.color = "#0f0";
                        lastSent = Date.now();
                    })
                    .catch(err => {
                        statusDiv.innerText = "Gagal Konek ke Laravel!";
                        statusDiv.style.color = "red";
                    });
            }
        });
    </script>
</body>
</html>
